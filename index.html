<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>Streak</title>
    <meta
      name="description"
      content="Private daily discipline. Keep the streak."
    />

    <link rel="manifest" href="/manifest.json" />
    <link
      rel="manifest"
      href="/manifest-light.json"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="manifest"
      href="/manifest.json"
      media="(prefers-color-scheme: dark)"
    />

    <meta name="theme-color" content="#131313" />
    <meta
      name="theme-color"
      content="#FEFFF1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#131313"
      media="(prefers-color-scheme: dark)"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Streak" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-light.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/icon-light-32.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/icon-dark-32.png"
      media="(prefers-color-scheme: dark)"
    />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-dark.png" />
    <link
      rel="apple-touch-icon"
      href="/icons/apple-touch-icon-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="apple-touch-icon"
      href="/icons/apple-touch-icon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
