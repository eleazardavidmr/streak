  </head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen antialiased selection:bg-primary-container selection:text-on-primary-container"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><h1 class="font-headline-sm text-headline-sm tracking-tight text-on-surface uppercase">Achievements</h1><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-24 bg-surface"><div class="flex flex-col w-full max-w-md mx-auto space-y-space-lg">
<div class="flex items-center justify-between py-space-xs">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 -ml-2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[24px]">chevron_left</span>
</button>
<button class="font-label-md text-label-md tracking-wider uppercase text-on-surface hover:text-primary-container px-3 py-2 transition-colors focus:outline-none" id="skip-top-btn" type="button">
      Skip
    </button>
</div>
<div class="flex flex-col space-y-space-xs">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-primary-container font-semibold">Step 4 of 4</span>
<h2 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight font-semibold">
      Want to note what happened?
    </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant pt-1">
      Completely optional. Patterns help you safeguard future streaks.
    </p>
</div>
<div class="flex flex-col space-y-space-sm pt-2">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-outline font-semibold">Time of Day</span>
<div aria-label="Time of Day" class="grid grid-cols-4 gap-2" role="radiogroup">
<button aria-checked="false" class="time-pill py-2.5 rounded-full font-label-md text-label-md text-center bg-surface-container-high text-on-surface-variant transition-all hover:bg-surface-variant focus:outline-none" data-val="morning" role="radio" type="button">
        Morning
      </button>
<button aria-checked="true" class="time-pill py-2.5 rounded-full font-label-md text-label-md text-center bg-primary-container text-on-primary font-semibold transition-all focus:outline-none" data-val="afternoon" role="radio" type="button">
        Afternoon
      </button>
<button aria-checked="false" class="time-pill py-2.5 rounded-full font-label-md text-label-md text-center bg-surface-container-high text-on-surface-variant transition-all hover:bg-surface-variant focus:outline-none" data-val="evening" role="radio" type="button">
        Evening
      </button>
<button aria-checked="false" class="time-pill py-2.5 rounded-full font-label-md text-label-md text-center bg-surface-container-high text-on-surface-variant transition-all hover:bg-surface-variant focus:outline-none" data-val="night" role="radio" type="button">
        Night
      </button>
</div>
</div>
<div class="flex flex-col space-y-space-sm pt-2">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm uppercase tracking-widest text-outline font-semibold" for="reflection-notes">Observations</label>
<span class="font-label-sm text-label-sm text-outline" id="char-counter">0 / 280</span>
</div>
<div class="relative bg-surface-container-low rounded-DEFAULT p-space-md transition-colors focus-within:bg-surface-container">
<textarea class="w-full bg-transparent font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:outline-none resize-none leading-relaxed" id="reflection-notes" maxlength="280" placeholder="What triggered this? (optional)... e.g. stress, fatigue, loneliness, boredom" rows="5"></textarea>
</div>
</div>
<div class="flex items-center gap-space-sm px-space-xs text-on-surface-variant pt-2">
<span class="material-symbols-outlined text-[18px] text-primary-container" style="font-variation-settings: 'FILL' 1;">lock</span>
<p class="font-label-md text-label-md">
      This note stays encrypted on your device only.
    </p>
</div>
<div class="flex flex-col space-y-space-md pt-4">
<button class="w-full h-[52px] rounded-full bg-primary-container text-on-primary font-label-md text-label-md tracking-wide font-semibold flex items-center justify-center active:scale-[0.98] transition-all" id="save-btn" type="button">
      Save &amp; complete reset
    </button>
<button class="w-full py-2 font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors text-center focus:outline-none" id="skip-bottom-btn" type="button">
      Skip and finish
    </button>
</div>
</div>
<script>
  (function() {
    const pills = document.querySelectorAll('.time-pill');
    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        pills.forEach(p => {
          p.setAttribute('aria-checked', 'false');
          p.className = 'time-pill py-2.5 rounded-full font-label-md text-label-md text-center bg-surface-container-high text-on-surface-variant transition-all hover:bg-surface-variant focus:outline-none';
        });
        pill.setAttribute('aria-checked', 'true');
        pill.className = 'time-pill py-2.5 rounded-full font-label-md text-label-md text-center bg-primary-container text-on-primary font-semibold transition-all focus:outline-none';
      });
    });

    const textarea = document.getElementById('reflection-notes');
    const counter = document.getElementById('char-counter');
    if (textarea && counter) {
      textarea.addEventListener('input', () => {
        counter.textContent = `${textarea.value.length} / 280`;
      });
    }

    const finishFlow = (saved) => {
      const saveBtn = document.getElementById('save-btn');
      if (saveBtn) {
        saveBtn.innerText = saved ? 'Completed' : 'Reset Finished';
        saveBtn.classList.add('opacity-80');
      }
      setTimeout(() => {
        window.location.hash = '#dashboard';
      }, 400);
    };

    document.getElementById('save-btn')?.addEventListener('click', () => finishFlow(true));
    document.getElementById('skip-top-btn')?.addEventListener('click', () => finishFlow(false));
    document.getElementById('skip-bottom-btn')?.addEventListener('click', () => finishFlow(false));
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary [&amp;_.tab-indicator]:opacity-100"><div class="flex items-center justify-around h-16 px-margin"><a class="relative flex flex-col items-center justify-center min-w-[44px] min-h-[44px] text-outline hover:text-on-surface transition-colors" data-path="dashboard" href="#"><span class="material-symbols-outlined text-[24px]">radio_button_checked</span><span class="tab-indicator absolute bottom-1 w-[3px] h-[3px] rounded-full bg-primary-container pointer-events-none"></span></a><a aria-current="page" class="relative flex flex-col items-center justify-center min-w-[44px] min-h-[44px] transition-colors text-primary [&amp;_.tab-indicator]:opacity-100" data-path="achievements" href="#"><span class="material-symbols-outlined text-[24px]">award_star</span><span class="tab-indicator absolute bottom-1 w-[3px] h-[3px] rounded-full bg-primary-container pointer-events-none"></span></a><a class="relative flex flex-col items-center justify-center min-w-[44px] min-h-[44px] text-outline hover:text-on-surface transition-colors" data-path="settings" href="#"><span class="material-symbols-outlined text-[24px]">tune</span><span class="tab-indicator absolute bottom-1 w-[3px] h-[3px] rounded-full bg-primary-container pointer-events-none"></span></a></div></nav></body></html>
